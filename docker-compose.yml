services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: redpanda
    command:
      - redpanda
      - start
      - --smp=2
      - --memory=2G
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=redpanda:8082
    ports:
      - "9092:9092"
      - "9644:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: redpanda-console
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: postgres
    shm_size: "1g"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-logs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-logs}
      POSTGRES_DB: ${POSTGRES_DB:-logs}
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - synchronous_commit=off
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=1.1
      - -c
      - work_mem=32MB
      - -c
      - autovacuum_max_workers=4
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-logs} -d ${POSTGRES_DB:-logs}"]
      interval: 5s
      timeout: 5s
      retries: 30

  topic-init:
    build: .
    image: log-pipeline:latest
    command: ["python", "scripts/create_topics.py"]
    env_file: .env
    depends_on:
      redpanda:
        condition: service_healthy
    restart: "no"

  producer:
    build: .
    image: log-pipeline:latest
    command: ["python", "-m", "services.producer"]
    env_file: .env
    depends_on:
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped

  indexer:
    build: .
    image: log-pipeline:latest
    command: ["python", "-m", "services.indexer"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped

  alerter:
    build: .
    image: log-pipeline:latest
    command: ["python", "-m", "services.alerter"]
    env_file: .env
    depends_on:
      topic-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pgdata:
